<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSim Global - Kiểm tra đăng nhập</title>
</head>
<body>
    <main>
        <h1>AgriSim Global</h1>
        <p>Đăng nhập để kiểm tra Firebase Authentication và API backend.</p>

        <form id="login-form">
            <label>Email <input id="email" type="email" autocomplete="email" required></label>
            <label>Mật khẩu <input id="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Đăng nhập</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
        <pre id="result" hidden></pre>
    </main>

    <script type="module">
        import { login } from "../services/firebase/auth.js";
        import { apiRequest } from "../services/api/apiClient.js";

        const form = document.querySelector("#login-form");
        const status = document.querySelector("#status");
        const result = document.querySelector("#result");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            status.textContent = "Đang đăng nhập và xác minh token...";
            result.hidden = true;

            try {
                await login(form.email.value, form.password.value);
                const profile = await apiRequest("/player/profile");
                status.textContent = "Xác thực thành công.";
                result.textContent = JSON.stringify(profile, null, 2);
                result.hidden = false;
            } catch (error) {
                status.textContent = `Không thể xác thực: ${error.message}`;
            }
        });
    </script>
</body>
</html>
