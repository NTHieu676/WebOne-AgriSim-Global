<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgriSim Global</title>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/scrollbar.js"></script>
  <script src="utils/format.js"></script>
  <script src="services/mock/gameStore.js"></script>
  <script src="services/firebase/firebase.mock.js"></script>
  <script src="services/firebase/auth.mock.js"></script>
  <script src="services/api/apiClient.mock.js"></script>
  <script src="utils/guard.js"></script>
</head>
<body>
  <p style="font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;padding:24px">Đang chuyển trang…</p>
  <script>
    AgriSim.auth.ready().then(function () {
      if (!AgriSim.store.session()) return "anon";
      return AgriSim.api.getGame().then(function () { return AgriSim.gameState(); }).catch(function () { return "anon"; });
    }).then(function (state) {
      AgriSim.go(state === "anon" ? "landing" : state === "nogame" ? "start" : state === "ended" ? "end" : "home");
    });
  </script>
</body>
</html>
